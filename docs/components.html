<!doctype html>
<!-- html-has-lang: missing lang attribute -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ADA Test Lab — Components</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    nav { background: #222; padding: 12px 20px; }
    nav a { color: #444; margin-right: 16px; text-decoration: none; }
    .content { padding: 20px; max-width: 800px; }
    .icon-button { width: 18px; height: 18px; padding: 0; border: none; background: #eee; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="components.html">Components</a>
  </nav>

  <div class="content">
    <h1>Components</h1>

    <!-- button-name: icon-only button, empty -->
    <button class="icon-button"><svg width="18" height="18"><rect width="18" height="18" /></svg></button>

    <!-- label: input with only a placeholder, no label/aria-label -->
    <input type="text" class="search-box" placeholder="Search components">

    <!-- select-name: no associated label -->
    <select class="opt-select">
      <option value="">Choose a size</option>
      <option value="sm">Small</option>
      <option value="lg">Large</option>
    </select>

    <!-- frame-title: iframe with no title -->
    <iframe class="embed-frame" src="https://example.com/embed" width="300" height="150"></iframe>
  </div>
</body>
</html>
