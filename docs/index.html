<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ADA Test Lab</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    nav { background: #222; padding: 12px 20px; }
    nav a { color: #444; margin-right: 16px; text-decoration: none; }
    .content { padding: 20px; max-width: 800px; }
    .faint-note { color: #999999; background: #ffffff; }
    .icon-link { display: inline-block; width: 20px; height: 20px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="components.html">Components</a>
  </nav>

  <div class="content">
    <h1>ADA Test Lab</h1>
    <p>A small seeded fixture for testing the Auto-Fix pipeline end to end.</p>

    <!-- heading-order: h1 -> h4 skips h2/h3 -->
    <h4 class="sub-heading">Recent activity</h4>

    <!-- image-alt: missing alt entirely -->
    <img src="hero.svg" width="240" height="80">

    <!-- link-name: icon-only link, no text/aria-label -->
    <a href="https://example.com" class="icon-link"><svg width="20" height="20"><circle cx="10" cy="10" r="10" /></svg></a>

    <!-- color-contrast: light gray text on white -->
    <p class="faint-note">This note is too low-contrast to read comfortably.</p>
  </div>
</body>
</html>
